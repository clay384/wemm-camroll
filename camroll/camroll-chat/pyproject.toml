[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "camroll-chat"
version = "0.1.0"
description = "LAN chat facade for a read-only frozen CamRoll PhotoBench album snapshot."
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.128.8",
    "httpx==0.28.1",
    "Pillow==11.3.0",
    "uvicorn==0.39.0",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[tool.setuptools.packages.find]
include = ["camroll_chat*"]
