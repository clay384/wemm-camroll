[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "camroll-agent"
version = "0.2.0"
description = "Agentic search over a personal photo library: VLM captioning, event grouping, and a ReAct agent with atomic search tools."
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Thao Nguyen" }]
keywords = ["agent", "react", "photo-library", "vlm", "rag", "memory"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
]
# Cloud-API setup (default). Local Qwen-VL / Kimi-VL backend needs the
# extra deps in requirements_local.txt.
dependencies = [
    "numpy==1.26.4",
    "Pillow==11.3.0",
    "requests==2.32.5",
    "tqdm==4.70.1",
    "openai==2.48.0",
    "jsonschema==4.25.1",
    "jieba==0.42.1",
    "fastapi==0.128.8",
    "uvicorn==0.39.0",
    "setuptools<81",
]

[project.optional-dependencies]
# Local VLM via HuggingFace (Qwen-VL, Kimi-VL). Needs a GPU.
# Equivalent to: pip install -r requirements_local.txt
local = [
    "torch>=2.0",
    "transformers>=4.51",
    "accelerate>=0.30",
    "qwen-vl-utils>=0.0.10",
    "sentence-transformers>=2.7",
]

dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
camroll-agent = "camroll_agent.cli:main"
camroll-eval = "camroll_eval.__main__:main"

[project.urls]
Homepage = "https://github.com/thaoshibe/camroll"

[tool.setuptools.packages.find]
include = ["camroll_agent*", "camroll_eval*"]

[tool.setuptools.package-data]
camroll_eval = ["static/*", "*.json"]
